<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <defs>
    <!-- تدرج لوني عصري بنفسجي/أزرق -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <!-- خلفية دائرية مع تدرج لوني -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" />
  
  <!-- موجات صوتية مدمجة مع زر التشغيل -->
  <rect x="26" y="42" width="6" height="16" rx="3" fill="#ffffff" />
  <rect x="38" y="32" width="6" height="36" rx="3" fill="#ffffff" />
  <rect x="50" y="24" width="6" height="52" rx="3" fill="#ffffff" />
  <rect x="62" y="32" width="6" height="36" rx="3" fill="#ffffff" />
  <rect x="74" y="42" width="6" height="16" rx="3" fill="#ffffff" />
</svg>
